<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FLARE | Movies</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="movie.css">

</head>


<body>


<header class="navbar">

    <a href="index.html" class="logo">
        <span>F</span> FLARE
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="weather.html">
            Weather
        </a>

        <a href="movie.html" class="active">
            Movies
        </a>

    </nav>

</header>



<main class="movie-container">


    <section class="movie-heading">

        <p class="eyebrow">
            MOVIE SEARCH
        </p>


        <h1>
            Find your next story.
        </h1>


        <p>
            Search for any movie and discover
            something worth watching.
        </p>

    </section>



    <form
        id="movieForm"
        class="search-box"
    >

        <input
            type="text"
            id="movieInput"
            placeholder="Enter movie name..."
            autocomplete="off"
            required
        >


        <button type="submit">
            Search
        </button>

    </form>



    <p
        id="movieStatus"
        class="status"
    ></p>



    <section
        id="movieGrid"
        class="movie-grid"
    ></section>


</main>



<footer>
    FLARE • Movies
</footer>



<script
    src="movie.js"
></script>


</body>

</html>
